<script>
var KEY='hunter-system-v1';
var STATS={STR:'體能',INT:'智力',VIT:'健康',SEN:'心靈',AGI:'效率'};
var S=null,tab='status',ovq=[],confirmId=null;
function z(n){return String(n).padStart(2,'0')}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
var T=ds(),Y=ds(new Date(Date.now()-864e5));
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function need(l){return 100+(l-1)*50}
function rankOf(l){return l>=30?'S':l>=20?'A':l>=15?'B':l>=10?'C':l>=5?'D':'E'}
function fresh(){return{name:'玩家',lv:1,xp:0,hp:100,day:T,stats:{STR:0,INT:0,VIT:0,SEN:0,AGI:0},habits:[],rewards:[]}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}
 if(!S||!S.habits)S=fresh();
 if(S.init===undefined)S.init=S.habits.length>0;
 applyTheme();rollover();if(!S.init&&!S.habits.length)ovq.push({k:'quiz'})}
function save(){checkAch();try{localStorage.setItem(KEY,JSON.stringify(S));lastSave={ok:1,t:Date.now()}}catch(e){lastSave={ok:0,t:Date.now()};saveFail()}}
function daysDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function rollover(){var L=[],hp=0,xp=0;if(S.pro===undefined&&S.init)S.pro=1;S.gems=S.gems||0;S.pity=S.pity||0;S.rewards=S.rewards||[];S.rewards.forEach(function(r){if(r.price===undefined){r.price=Math.max(10,(r.lv||1)*10);r.cnt=r.claimed?1:0}});S.dungeons=S.dungeons||[];S.habits.forEach(function(h){delete h.link});S.dungeons.forEach(function(d){if(d.goal)delete d.goal.m});
 S.habits.forEach(function(h){if(fqT(h)==='n')weekEval(h);else if(h.last&&h.last<Y&&brokeFrom(h,h.last)){if(S.sage&&S.sage.lv>1&&h.streak>=3&&(!S.shieldAt||daysDiff(S.shieldAt,T)>=7)){S.shieldAt=T;h.last=Y;toast('[系統] 詠唱破棄：已保護「'+h.name+'」的連續天數')}else h.streak=0}
  if(S.hard&&h.type==='good'){var b=h.last||h.start||S.day;if(h.pen&&h.pen>b)b=h.pen;
   var m=Math.min(3,missCnt(h,b));if(m>0){hp+=10*m;xp+=Math.ceil(h.xp/2)*m;L.push(h.name+'：漏做 '+m+' 天')}}
  h.pen=Y});
 if(S.day!==T){S.hp=Math.min(100,S.hp+10+eff().rg+(sk('s2')?5:0));poison()}
 dExpire();sageWarn();if(S.urg&&S.urg.d!==T&&S.urg.i>=0&&S.urg.st==='on'&&!S.urg.done&&S.hard){hp+=5;L.push('緊急任務未完成：'+URG[S.urg.i])}if(!S.urg||S.urg.d!==T)S.urg={d:T,i:Math.random()<.5?Math.floor(Math.random()*URG.length):-1,done:false,st:'new'};shadowPay();S.day=T;
 if(hp){S.hp-=hp;S.xp=Math.max(0,S.xp-xp);var nd=nearDeath();if(nd===1)L.push('不屈意志發動：免於瀕死，HP 回復至 30');else if(nd===2)L.push('瀕死：本級經驗歸零，HP 回復至 50');ovq.push({k:'pen',L:L,hp:hp,xp:xp})}
 save()}
function tick(){if(ds()!==T){T=ds();Y=ds(new Date(Date.now()-864e5));rollover();render();flush();return}updateCd();updateTm()}
function nOpen(){return S.habits.filter(function(h){return !done(h)&&h.type==='good'&&dueToday(h)}).length}
function updateCd(){var n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((e-n)/1000),t=z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60),op=nOpen();
 document.querySelectorAll('.cd').forEach(function(x){x.textContent='距離截止 '+t;x.style.color=(s<10800&&op)?'var(--red)':'var(--glow)'})}
function cdBox(){return'<div class="win"><div class="ttl"><span>[ 今日截止 ]</span><span class="cd"></span></div><div class="sub" style="margin:0">尚有 '+nOpen()+' 項好習慣未完成。'+(S.hard?'困難模式：漏做會自動扣 HP 與 XP。':'午夜過後未完成，連續天數會中斷。')+'</div></div>'}
function modeBox(){return'<div class="win"><div class="ttl"><span>[ 難度模式 ]</span></div><div class="sub" style="margin:0 0 8px">'+(S.hard?'困難模式：好習慣每漏做一天，自動扣 10 HP 與該任務一半 XP（一次最多結算 3 天）。':'一般模式：漏做只會中斷連續天數。')+'</div><div class="btns"><button class="b '+(S.hard?'r':'')+'" onclick="toggleHard()">切換為'+(S.hard?'一般':'困難')+'模式</button><button class="b" onclick="startQuiz()">重新做覺醒測驗</button><button class="b" onclick="showPro(0)">重看序章</button></div><div class="btns"><button class="b" onclick="exportData()">匯出備份</button><button class="b" onclick="importData()">匯入備份</button><button class="b" onclick="toggleTheme()">切換主題（橘黑／藍紫）</button><button class="b r" onclick="askReset()">重做角色</button></div></div>'}
function toggleHard(){S.hard=!S.hard;S.habits.forEach(function(h){h.pen=Y});save();render();toast('[系統] 已切換為'+(S.hard?'困難':'一般')+'模式',S.hard)}
var GL=[['改掉拖延','AGI','good','25 分鐘專注衝刺','擊敗拖延魔',14,[['c',10]]],['維持健身','STR','good','運動 {m} 分鐘','鋼鐵體魄之門',21,[['c',12]]],['多喝水','VIT','good','喝水 2000cc','生命之泉',7,[['s',7]]],['不熬夜','VIT','good','{sl} 前就寢','不眠者之夜',14,[['c',12]]],['不吃甜食','VIT','bad','不吃甜食與含糖飲料','斷糖之戰',14,[['s',7],['c',12]]],['禁慾（自我克制）','SEN','bad','自我克制','禁慾者之路',21,[['s',14]]],['不滑手機','SEN','bad','不滑短影音與手機','斷網者的試煉',14,[['s',5],['c',12]]],['閱讀','INT','good','閱讀 {m} 分鐘','禁書庫',21,[['c',15]]]];
var QS=[{q:'你的作息比較接近？',o:['早起型（早睡早起）','夜貓型（晚睡晚起）']},{q:'你最想達成哪些目標？（最多選 3 項）',m:1,o:GL.map(function(g){return g[0]})},{q:'每天能投入的程度？（決定任務難度與 XP）',o:['輕鬆（簡單 15 XP）','普通（中等 30 XP）','認真（困難 50 XP）']},{q:'選擇難度模式',o:['一般模式（漏做只中斷連續）','困難模式（漏做自動受罰）']}];
var QZ=null;
function startQuiz(){QZ={i:0,a:[],sel:[]};qz()}
function qz(){var q=QS[QZ.i];$('#ov').innerHTML='<div class="ov"><div class="win" style="max-height:92vh;overflow:auto"><div class="ttl"><span>[ 覺醒測驗 '+(QZ.i+1)+'／'+QS.length+' ]</span></div><div style="font-weight:700;margin-bottom:10px;text-align:left">'+q.q+'</div>'+q.o.map(function(t,k){return'<button class="b opt'+(QZ.sel.indexOf(k)>-1?' sel':'')+'" onclick="pick('+k+')">'+t+'</button>'}).join('')+(q.m?'<div class="btns" style="justify-content:center"><button class="b g" onclick="nextQ()">下一題</button></div>':'')+'<div class="btns" style="justify-content:center"><button class="b x" style="margin-left:0" onclick="skipQ()">略過測驗</button></div></div></div>'}
function pick(k){var q=QS[QZ.i];if(q.m){var p=QZ.sel.indexOf(k);if(p>-1)QZ.sel.splice(p,1);else if(QZ.sel.length<3)QZ.sel.push(k);qz()}else{QZ.a.push([k]);QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}}

quests:['任務','打卡位置就在這一頁：每個任務卡片下方按「完成」（壞習慣按「今天忍住了」）。每天至少打卡一個任務，全帳號的「連續打卡」天數就會增加。好習慣按「完成」；要戒除的壞習慣按「今天忍住了」，破戒了就按「破戒了」，會扣 HP 和 XP。難度決定 XP：簡單 15、中等 30、困難 50。每個任務有連續天數與目標天數，達標後可收編為暗影士兵（永久 XP 加成）。上方可切換「待辦事項」與「已完成」。「專注工具」有番茄鐘（可綁定任務，時間到自動打卡）與呼吸冥想。忙碌時可按「低負擔：…」（只拿約 40% XP、沒有加成進度，但保住連續與紀錄）。誤按可在卡片按「撤銷」（只能撤銷最近一次）；編輯與刪除在卡片右下角的「⋯」選單。「每週幾次」改以整週是否達標來判定，連續單位是「週」（要週一到週日做滿才算一週）。數量型任務（例如喝水 2000cc）可分次按「＋250」累積，達標自動完成，低負擔版本也會計入進度。頻率可選「每天／指定星期／每週幾次」：休息日不會中斷連續、也不會被懲罰，想加練仍可直接完成。'],
dun:['副本','「覺醒挑戰」是依你的覺醒測驗產生的專屬挑戰，每個都有明確目標。「傳送門」可自訂 1 到 3 個目標（指定任務的完成次數或連續天數），全部達成才通關，期限到沒達成就失敗。「試煉之塔」每層有一個累計完成次數目標，通關往上、失敗退一層。「首領討伐」用你的真實目標當首領，回報目前數值來推進。「支配者之觸」每天一次，讓一個「完成次數」目標的副本進度 +1。副本進度＝實際完成次數＋技能或屬性加成，兩者分開顯示，實際完成次數不會被加成影響。體能、名裝、暗影等加成會提高完成次數目標「額外 +1」的機率。通關可得魂晶、戰利品，並有機會收編暗影。'],
army:['暗影','這裡有兩種暗影：達標的習慣會成為習慣暗影，每個永久加成 10% XP；通關副本或抽卡得到的暗影士兵放在「影子空間」。只有「出戰」的士兵提供加成，名額隨等級增加；名額滿時按「出戰」會與最弱的出戰者交換。每隻士兵有專長，對應的副本會有額外進度加成。'],
vault:['寶庫','「魂晶」是通用貨幣，來自完成任務、通關副本與成就。「單抽」10 魂晶、「十連」90 魂晶，可抽到裝備、技能與暗影士兵，30 抽內必出傳說，十連至少一個稀有。裝備分武器、防具、飾品三格，每格自動採用最高稀有度的一件，提供 XP 加成。技能是被動效果，抽到就永久生效。「名裝」來自特定副本，最多裝備 2 把（雙持）。'],

  if(b.length)h+='<div class="win" style="border-color:#7a2442"><div class="ttl" style="color:var(--red)">[ 戒除目標：敵人 ]</div>'+b.map(card).join('')+'</div>';var rs=qf==='todo'?H.filter(function(x){return!dueToday(x)&&!done(x)}):[];if(rs.length)h+='<div class="win"><div class="ttl">[ 今日休息 ]</div><div class="sub" style="margin:0 0 8px">依你設定的頻率，今天不用做；想加練也可以直接完成。</div>'+rs.map(card).join('')+'</div>'}
 if(tab==='army'){
  var sh=shadows();
  h+='<div class="win arise" style="border-color:var(--violet)"><div class="ttl" style="color:var(--violet)">[ 暗影軍團 ]</div><div class="sub" style="margin:0">你是君主，每個達成目標的習慣都是你的暗影士兵。人數越多，所有 XP 加成越高。目前 ×'+mult().toFixed(1)+'。</div></div>';
  if(!sh.length)h+='<div class="empty">尚無暗影。讓任何習慣連續達成目標天數，就能將它收編。</div>';
  sh.forEach(function(x){var r=sRank(x);h+='<div class="sh"><img class="ic" style="width:56px;height:56px" src="img/F'+(5+['兵','騎','精','將'].indexOf(r[0]))+'.jpg" alt=""><div style="flex:1"><div class="qn">'+esc(x.name)+'</div><div class="sub" style="margin:2px 0 0">'+r[1]+'　連續 '+x.streak+' 天　累計 '+x.total+' 次</div></div></div>'});
  var cand=H.filter(function(x){return !x.shadow}).sort(function(a,b){return b.streak/b.goal-a.streak/a.goal}).slice(0,3);
  if(cand.length){h+='<div class="win"><div class="ttl">[ 候補 ]</div>'+cand.map(function(x){return'<div style="margin-bottom:10px"><div class="row" style="margin:0 0 3px"><span style="color:var(--text)">'+esc(x.name)+'</span><span>還差 '+Math.max(0,x.goal-x.streak)+' 天</span></div><div class="bar gd"><i style="width:'+Math.min(100,x.streak/x.goal*100)+'%"></i></div></div>'}).join('')+'</div>'}}
 if(tab==='shop'){h+=achView()+shopView();$('#app').innerHTML=h;updateCd();return}
 if(tab==='army')h+=legionView2();if(tab==='dun')h+=dunView();if(tab==='vault')h+=vaultView()+namedBox();$('#app').innerHTML=h;updateCd()}
