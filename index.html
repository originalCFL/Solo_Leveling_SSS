<style>
:root{--bg:#04060d;--panel:rgba(9,18,44,.78);--line:#2a62e6;--glow:#4da3ff;--text:#d6e4ff;--dim:#7e93bf;--violet:#9a5cff;--red:#ff4466;--gold:#ffc857;--green:#3ee0a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

.lv{font-size:64px;font-weight:800;line-height:1;color:#fff;text-shadow:0 0 14px var(--glow),0 0 32px var(--line)}
.lvl{font-size:12px;color:var(--dim)}
.rank{display:inline-block;border:1px solid var(--violet);color:var(--violet);padding:1px 8px;font-size:12px;margin-top:4px}
.nm{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--text);font:inherit;font-size:18px;font-weight:700;width:100%;padding:2px 0}

.st{font-size:13px}.st b{float:right;color:#fff}

.q{border:1px solid #1d3a86;padding:10px 12px;margin-bottom:10px;background:rgba(5,12,32,.6)}
.q.bad{border-color:#6b2038}
.q.done{opacity:.6}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qn{font-weight:700}

.bad .tag{color:var(--red);border-color:#6b2038}
.sub{font-size:12px;color:var(--dim);margin:6px 0 4px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.b{background:rgba(42,98,230,.18);border:1px solid var(--glow);color:#fff;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
button.b:hover{background:rgba(77,163,255,.35)}
button.b:disabled{opacity:.4;cursor:default}
button.b.r{border-color:var(--red);background:rgba(255,68,102,.14)}
button.b.g{border-color:var(--gold);background:rgba(255,200,87,.14);color:var(--gold)}
button.b.x{border-color:#334;color:var(--dim);background:none;margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.add{width:100%;padding:12px;margin-bottom:12px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 6px}
.sh{display:flex;gap:12px;align-items:center;border:1px solid #3b2a73;background:linear-gradient(90deg,rgba(154,92,255,.16),transparent);padding:10px 12px;margin-bottom:10px}
.sh .em{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--violet);color:var(--violet);font-weight:800;box-shadow:0 0 14px rgba(154,92,255,.6);flex:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,4,12,.9);display:grid;place-items:center;padding:20px}
.ov .win{width:100%;max-width:420px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.big{font-size:44px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--glow),0 0 40px var(--line);margin:6px 0}
.arise .big{text-shadow:0 0 12px var(--violet),0 0 40px #5a2bd0}

.glitch{animation:gl 2.2s steps(1) infinite}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px);color:var(--glow)}95%{transform:translate(3px,-1px);color:var(--violet)}97%{transform:none}}
@media (prefers-reduced-motion:reduce){.ov .win,.flash,.glitch{animation:none}.bar i{transition:none}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:rgba(6,14,38,.96);border:1px solid var(--glow);padding:8px 12px;font-size:13px;box-shadow:0 0 14px rgba(77,163,255,.5)}
#toast .bad{border-color:var(--red);box-shadow:0 0 14px rgba(255,68,102,.4)}
label{display:block;text-align:left;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,select{width:100%;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.seg button.sel{background:rgba(77,163,255,.4)}
.cd{font-size:12px}.opt{display:block;width:100%;margin-bottom:8px;text-align:left;padding:11px 14px}.opt.sel{background:rgba(77,163,255,.45);box-shadow:0 0 10px var(--glow)}
html{background:#04060d}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}textarea{width:100%;height:150px;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px;resize:none}

:root[data-th=o]{--line:#ff6a00;--glow:#ff7a1a;--violet:#ffb347;--text:#f4ece4;--dim:#a8917d;--bg:#060504;--panel:rgba(22,14,8,.82)}
:root[data-th=o] body{background:radial-gradient(1200px 600px at 50% -10%,#3b1a06 0,transparent 60%),#060504}

:root[data-th=o] button.b{background:rgba(255,106,0,.16)}
:root[data-th=o] button.b.r{background:rgba(255,68,102,.14)}
:root[data-th=o] button.b.g{background:rgba(255,200,87,.14)}
:root[data-th=o] .seg button.sel,:root[data-th=o] .opt.sel{background:rgba(255,106,0,.42)}
:root[data-th=o] .tabs{background:rgba(8,5,3,.96)}
.q{border-left:3px solid var(--glow)}.q.bad{border-left-color:var(--red)}.qn{font-size:16px}
.cfw{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}.cfw i{position:absolute;top:-14px;width:8px;height:14px;animation:cf 2.4s ease-in forwards}@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
.hlp summary{cursor:pointer;color:var(--glow);font-size:13px}
</style>

<script>
var KEY='hunter-system-v1';

var S=null,tab='status',ovq=[],confirmId=null;
function z(n){return String(n).padStart(2,'0')}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

 if(!S||!S.habits)S=fresh();
 if(S.init===undefined)S.init=S.habits.length>0;
 applyTheme();rollover();if(!S.init&&!S.habits.length)ovq.push({k:'quiz'})}
function save(){checkAch();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function daysDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function rollover(){var L=[],hp=0,xp=0;S.gems=S.gems||0;S.pity=S.pity||0;S.rewards=S.rewards||[];S.rewards.forEach(function(r){if(r.price===undefined){r.price=Math.max(10,(r.lv||1)*10);r.cnt=r.claimed?1:0}});S.dungeons=S.dungeons||[];
 S.habits.forEach(function(h){if(h.last&&h.last<Y){if(covered(h.last)){h.last=Y}else if(S.sage&&S.sage.lv>1&&h.streak>=3&&(!S.shieldAt||daysDiff(S.shieldAt,T)>=7)){S.shieldAt=T;h.last=Y;toast('[系統] 詠唱破棄：已保護「'+h.name+'」的連續天數')}else h.streak=0}
  if(S.hard&&h.type==='good'){var b=h.last||h.start||S.day;if(h.pen&&h.pen>b)b=h.pen;
   var m=Math.min(3,Math.max(0,daysDiff(b,Y)-sdCount(b,Y)));if(m>0){hp+=10*m;xp+=Math.ceil(h.xp/2)*m;L.push(h.name+'：漏做 '+m+' 天')}}
  h.pen=Y});
 if(S.day!==T){S.hp=Math.min(100,S.hp+10+eff().rg+(sk('s2')?5:0));poison()}
 dExpire();sageWarn();S.day=T;
 if(hp){S.hp-=hp;S.xp=Math.max(0,S.xp-xp);var nd=nearDeath();if(nd===1)L.push('不屈意志發動：免於瀕死，HP 回復至 30');else if(nd===2)L.push('瀕死：本級經驗歸零，HP 回復至 50');ovq.push({k:'pen',L:L,hp:hp,xp:xp})}
 save()}
function tick(){if(ds()!==T){T=ds();Y=ds(new Date(Date.now()-864e5));rollover();render();flush();return}updateCd()}

function updateCd(){var n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((e-n)/1000),t=z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60),op=nOpen();
 document.querySelectorAll('.cd').forEach(function(x){x.textContent='距離截止 '+t;x.style.color=(s<10800&&op)?'var(--red)':'var(--glow)'})}

function toggleHard(){S.hard=!S.hard;S.habits.forEach(function(h){h.pen=Y});save();render();toast('[系統] 已切換為'+(S.hard?'困難':'一般')+'模式',S.hard)}
var GL=[['改掉拖延','AGI','good','25 分鐘專注衝刺','擊敗拖延魔',14,[['c',10]]],['維持健身','STR','good','運動 {m} 分鐘','鋼鐵體魄之門',21,[['c',12]]],['多喝水','VIT','good','喝水 2000cc','生命之泉',7,[['s',7]]],['不熬夜','VIT','good','{sl} 前就寢','不眠者之夜',14,[['c',12]]],['不吃甜食','VIT','bad','不吃甜食與含糖飲料','斷糖之戰',14,[['s',7],['c',12]]],['禁慾（自我克制）','SEN','bad','自我克制','禁慾者之路',21,[['s',14]]],['不滑手機','SEN','bad','不滑短影音與手機','斷網者的試煉',14,[['s',5],['c',12]]],['閱讀','INT','good','閱讀 {m} 分鐘','禁書庫',21,[['c',15]]]];
var QS=[{q:'你的作息比較接近？',o:['早起型（早睡早起）','夜貓型（晚睡晚起）']},{q:'你最想達成哪些目標？（最多選 3 項）',m:1,o:GL.map(function(g){return g[0]})},{q:'每天能投入的程度？（決定任務難度與 XP）',o:['輕鬆（簡單 15 XP）','普通（中等 30 XP）','認真（困難 50 XP）']},{q:'選擇難度模式',o:['一般模式（漏做只中斷連續）','困難模式（漏做自動受罰）']}];
var QZ=null;

function pick(k){var q=QS[QZ.i];if(q.m){var p=QZ.sel.indexOf(k);if(p>-1)QZ.sel.splice(p,1);else if(QZ.sel.length<3)QZ.sel.push(k);qz()}else{QZ.a.push([k]);QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}}

 toast(ok?'[系統] 已複製備份':'請長按文字手動複製',!ok)}

 S=o;S.init=true;rollover();save();closeOv();toast('[系統] 備份已還原')}
var RK=['E','D','C','B','A','S'],RN=['普通','稀有','史詩','傳說'],RP=[1,2,4,8],LP=[.02,.04,.07,.12],KD=['武器','防具','飾品'];
var EQN=[['鐵匕首','獵人長劍','影之短刃','君王雙刃'],['皮甲','鎖子甲','暗影披風','君王鎧甲'],['銅戒','魔力吊墜','影子戒指','君王之冠']];
var SK={s1:['魂晶感應','完成任務時額外 +1 魂晶',1],s2:['再生','每日 HP 回復 +5',1],s3:['鐵壁','破戒時 HP 損失 −5',1],s4:['君王威壓','XP 加成 +5%',2],s5:['壓制','副本傷害 +20%',2],s6:['暗影支配','暗影收編機率 +20%',3]};

function setName(v){S.name=v.slice(0,12)||'玩家';save()}
function card(h){var p=Math.min(100,h.streak/h.goal*100),bad=h.type==='bad',d=done(h);
 return'<div class="q '+(bad?'bad ':'')+(d?'done':'')+'"><div class="qh"><div><span class="qn">'+esc(h.name)+'</span><span class="tag">'+STATS[h.stat]+' +1</span>'+(h.link?'<span class="tag">健康：'+LN[h.link.m]+'≥'+h.link.t+'</span>':'')+(h.shadow?'<span class="tag" style="color:var(--violet);border-color:var(--violet)">暗影</span>':'')+'</div><div style="font-size:13px;color:var(--gold);white-space:nowrap">+'+h.xp+' XP</div></div><div class="sub">連續 '+h.streak+' ／ 目標 '+h.goal+' 天　累計 '+h.total+' 次</div><div class="bar '+(h.shadow?'gd':'')+'"><i style="width:'+p+'%"></i></div><div class="btns"><button class="b" '+(d||h.link?'disabled':'')+' onclick="complete(\''+h.id+'\')">'+(d?'今日已完成':h.link?'等待健康資料':bad?'今天忍住了':'完成')+'</button>'+(bad?'<button class="b r" onclick="slip(\''+h.id+'\')">破戒了</button>':'')+'<button class="b x" onclick="del(\''+h.id+'\')">'+(confirmId===h.id?'確定刪除？':'刪除')+'</button></div></div>'}
function render(){
 var tabs=[['status','狀態'],['quests','任務'],['dun','副本'],['army','暗影'],['vault','寶庫'],['shop','成就商店']];
 $('#tabs').innerHTML=tabs.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 var h='',H=S.habits,dn=H.filter(done).length;h+=helpBox();
 if(tab==='status'){
  h+='<div class="win"><div class="ttl"><span>[ 狀態視窗 ]</span><span>'+T+'</span></div><div class="hero"><div onclick="document.getElementById(\'avf\').click()" style="cursor:pointer">'+avatar(72)+'<input type="file" accept="image/*" id="avf" style="display:none" onchange="upAv(this)"></div><div><div class="lv">'+S.lv+'</div><div class="lvl">等級</div></div><div style="flex:1"><input class="nm" value="'+esc(S.name)+'" onchange="setName(this.value)" aria-label="玩家名稱"><div class="rank">階級 '+rankOf(S.lv)+'</div></div></div><div class="row"><span>經驗值</span><span>'+S.xp+' ／ '+need(S.lv)+'</span></div><div class="bar"><i style="width:'+S.xp/need(S.lv)*100+'%"></i></div><div class="row"><span>生命值</span><span>'+S.hp+' ／ 100</span></div><div class="bar hp"><i style="width:'+S.hp+'%"></i></div></div>';
  h+='<div class="win"><div class="ttl"><span>[ 能力值 ]</span><span style="color:var(--gold)">'+(S.pts?'可分配 '+S.pts+' 點':'')+'</span></div><div class="stats">'+Object.keys(STATS).map(function(k){return'<div class="st">'+STATS[k]+(S.pts?' <button class="b" style="padding:0 10px" onclick="alloc(\''+k+'\')">＋</button>':'')+'<b>'+S.stats[k]+'</b></div>'}).join('')+'</div><div class="sub" style="margin:10px 0 0">'+effTxt()+'</div></div>';
  h+='<div class="win"><div class="ttl"><span>[ 今日進度 ]</span><span class="cd"></span></div><div class="row" style="margin-top:0"><span>已完成任務</span><span>'+dn+' ／ '+H.length+'</span></div><div class="bar"><i style="width:'+(H.length?dn/H.length*100:0)+'%"></i></div><div class="sub">連續打卡 '+gsNow()+' 天（最高 '+(S.gsBest||0)+'）　暗影士兵 '+shadows().length+' 名，XP 加成 ×'+mult().toFixed(1)+'　魂晶 '+S.gems+'</div></div>';
  h+=domBox();h+=healthBox();h+=sneakBox();h+=sageBox();h+=modeBox()}
 if(tab==='quests'){
  h+=cdBox();h+=qseg();h+='<button class="b add" onclick="openAdd()">＋ 新增任務</button>';
  if(!H.length)h+='<div class="win empty">還沒有任務。新增你想養成或戒除的習慣，或先載入範例。<div class="btns" style="justify-content:center"><button class="b" onclick="starter()">載入範例任務</button></div></div>';
  var g=H.filter(function(x){return x.type==='good'&&(qf==='done')===done(x)}),b=H.filter(function(x){return x.type==='bad'&&(qf==='done')===done(x)});if(H.length&&!g.length&&!b.length)h+='<div class="empty">'+(qf==='done'?'今天還沒有完成的任務':'今天的任務全部完成了')+'</div>';
  if(g.length)h+='<div class="win"><div class="ttl">[ 每日任務 ]</div>'+g.map(card).join('')+'</div>';
  if(b.length)h+='<div class="win" style="border-color:#7a2442"><div class="ttl" style="color:var(--red)">[ 戒除目標：敵人 ]</div>'+b.map(card).join('')+'</div>'}
 if(tab==='army'){
  var sh=shadows();
  h+='<div class="win arise" style="border-color:var(--violet)"><div class="ttl" style="color:var(--violet)">[ 暗影軍團 ]</div><div class="sub" style="margin:0">你是君主，每個達成目標的習慣都是你的暗影士兵。人數越多，所有 XP 加成越高。目前 ×'+mult().toFixed(1)+'。</div></div>';
  if(!sh.length)h+='<div class="empty">尚無暗影。讓任何習慣連續達成目標天數，就能將它收編。</div>';
  sh.forEach(function(x){var r=sRank(x);h+='<div class="sh"><div class="em">'+r[0]+'</div><div style="flex:1"><div class="qn">'+esc(x.name)+'</div><div class="sub" style="margin:2px 0 0">'+r[1]+'　連續 '+x.streak+' 天　累計 '+x.total+' 次</div></div></div>'});
  var cand=H.filter(function(x){return !x.shadow}).sort(function(a,b){return b.streak/b.goal-a.streak/a.goal}).slice(0,3);
  if(cand.length){h+='<div class="win"><div class="ttl">[ 候補 ]</div>'+cand.map(function(x){return'<div style="margin-bottom:10px"><div class="row" style="margin:0 0 3px"><span style="color:var(--text)">'+esc(x.name)+'</span><span>還差 '+Math.max(0,x.goal-x.streak)+' 天</span></div><div class="bar gd"><i style="width:'+Math.min(100,x.streak/x.goal*100)+'%"></i></div></div>'}).join('')+'</div>'}}
 if(tab==='shop'){h+=achView()+shopView();$('#app').innerHTML=h;updateCd();return}
 if(tab==='army')h+=legionView2();if(tab==='dun')h+=dunView();if(tab==='vault')h+=vaultView()+namedBox();$('#app').innerHTML=h;updateCd()}
function go(t){tab=t;confirmId=null;render();window.scrollTo(0,0)}
load();render();flush();setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
